

<section class="auth-container">
        <div class="auth-card">
            <div class="text-center">
                <h1 class="auth-title">Dobrodošli Nazad</h1>
                <p class="auth-subtitle text-light">Prijavite se na vaš nalog za bržu kupovinu i ekskluzivne ponude.</p>
            </div>

            <!-- Form -->
            <form action="#" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail Adresa</label>
                    <div class="input-group input-group-custom">
                        <span class="input-group-text input-group-text-custom"><i class="fa-regular fa-envelope"></i></span>
                        <input type="email" class="form-control custom-input" id="email" placeholder="ime@primjer.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label mb-0">Lozinka</label>
                        <a href="#" class="text-decoration-none small text-light hover-accent" style="font-size: 0.8rem;">Zaboravili ste lozinku?</a>
                    </div>
                    <div class="input-group input-group-custom">
                        <span class="input-group-text input-group-text-custom"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control custom-input" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label small text-light" for="rememberMe">
                        Zapamti me na ovom uređaju
                    </label>
                </div>

                <button type="submit" class="btn btn-accent w-100 py-2 font-weight-bold">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Prijavi Se
                </button>
            </form>

            <div class="text-center mt-4 pt-2 border-top border-secondary border-opacity-10">
                <p class="small text-light mb-0">
                    Nemate nalog? <a href="#register" class="text-white font-weight-bold text-decoration-none border-bottom border-danger">Kreirajte nalog</a>
                </p>
            </div>
        </div>
</section>
